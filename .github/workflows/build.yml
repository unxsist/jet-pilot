name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package-lock.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package-lock.json"
      - ".github/workflows/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update;
          sudo apt install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev;
          sudo apt install -y \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1;

      - name: Build Vite + Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          npm run build

      - name: Upload test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jet-pilot-${{ matrix.platform }}
          # Each platform only produces its own bundle dirs (tauri.conf.json targets: "all");
          # missing dirs on other platforms are ignored as long as at least one matches.
          path: |
            src-tauri/target/release/bundle/dmg/
            src-tauri/target/release/bundle/appimage/
            src-tauri/target/release/bundle/deb/
            src-tauri/target/release/bundle/rpm/
            src-tauri/target/release/bundle/msi/
            src-tauri/target/release/bundle/nsis/
          # macOS builds are unsigned by design (no signing cert) - fine for testing.
          if-no-files-found: error
          retention-days: 14
