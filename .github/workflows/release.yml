name: Release

# One manual run takes a release from main to everyone, in this order:
#
#   prepare   CI is green on main and CHANGELOG.md has an entry for the next
#             version; semantic-release bumps, tags and opens a DRAFT release
#   build     the five platforms build from the tag into the draft
#   verify    every installer, signature and latest.json platform is there
#   publish   the release notes (CHANGELOG entry + install steps) go up and
#             the draft becomes the latest release
#   website   jet-pilot.app redeploys and serves the new latest.json, so
#             installed apps see the update
#   homebrew  the tap's cask moves to the new version
#   notify    released PRs and the issues they fix are told, and closed
#
# Nothing is public until publish: a failed build leaves a draft that only
# maintainers see. Fix the cause and use "Re-run failed jobs", or start the
# workflow again; prepare picks up a draft that's waiting.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check CI and the changelog and print the next version; release nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not ${GITHUB_REF_NAME}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: CI is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | test("^(test|Rust tests|test-build)"))]')
          pending=$(jq -r '[.[] | select(.status != "completed") | .name] | join(", ")' <<< "$runs")
          failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not)) | .name] | join(", ")' <<< "$runs")
          if [[ -n "$pending" ]]; then
            echo "::error::CI is still running on ${sha:0:7}: $pending. Start the release when it's done."
            exit 1
          fi
          if [[ -n "$failed" ]]; then
            echo "::error::CI failed on ${sha:0:7}: $failed"
            exit 1
          fi
          echo "CI on ${sha:0:7}: $(jq length <<< "$runs") checks passed"

      - name: Next version
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
        run: |
          npx semantic-release --dry-run --no-ci | tee dry-run.log
          version=$(sed -nE 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' dry-run.log | tail -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG.md has the entry
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          node -e '
            const { changelogEntry } = require("./.github/scripts/release.cjs");
            const version = process.env.VERSION;
            const entry = changelogEntry(version);
            if (!entry) {
              console.log(`::error::CHANGELOG.md has no entry for ${version}. Add "## ${version} (YYYY-MM-DD)" (see its header) and merge it first.`);
              process.exit(1);
            }
            const today = new Date().toISOString().slice(0, 10);
            if (entry.date !== today) {
              console.log(`::warning::The CHANGELOG.md entry for ${version} is dated ${entry.date}, not today (${today})`);
            }
            console.log(`CHANGELOG.md entry for ${version} (${entry.date}):\n\n${entry.body}`);
          '

      - name: Tag and draft the release
        id: release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
        run: |
          npx semantic-release
          # A new release, or a draft an earlier run left behind.
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          release=$(gh release view "$tag" --json databaseId,isDraft 2>/dev/null || true)
          if [[ -z "$release" ]]; then
            echo "::notice::Nothing to release: no changes since $tag that need one"
            exit 0
          fi
          if [[ $(jq -r .isDraft <<< "$release") != "true" ]]; then
            echo "::notice::Nothing to release: $tag is already out"
            exit 0
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_id=$(jq -r .databaseId <<< "$release")"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            echo "### Dry run: the next release is v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Dry run: nothing to release" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release_id != ''
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-15-intel # native x86_64 runner; tauri-action uses process.arch for the updater signature filename
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Linux ARM64
            platform: ubuntu-22.04-arm # (#60)
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build and attach to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          tauriScript: ./node_modules/.bin/tauri
          args: ${{ matrix.args }}

  verify:
    name: Verify
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # drafts are only readable with write access
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Every installer, signature and updater platform
        uses: actions/github-script@v7
        with:
          script: |
            const release = require("./.github/scripts/release.cjs");
            await release.verify({
              github,
              core,
              version: "${{ needs.prepare.outputs.version }}",
              releaseId: "${{ needs.prepare.outputs.release_id }}",
            });

  publish:
    name: Publish
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Release notes, then publish
        uses: actions/github-script@v7
        with:
          script: |
            const release = require("./.github/scripts/release.cjs");
            const url = await release.publish({
              github,
              core,
              version: "${{ needs.prepare.outputs.version }}",
              releaseId: "${{ needs.prepare.outputs.release_id }}",
            });
            if (url) await core.summary.addRaw(`### Published [${{ needs.prepare.outputs.tag }}](${url})\n`).write();

  website:
    name: Website and updater
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy jet-pilot.app
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml -R unxsist/jet-pilot-docs --ref main
          for _ in $(seq 1 30); do
            run=$(gh run list -R unxsist/jet-pilot-docs --workflow deploy.yml --event workflow_dispatch \
              --created ">=$since" -L 1 --json databaseId -q '.[0].databaseId')
            [[ -n "$run" ]] && break
            sleep 5
          done
          if [[ -z "$run" ]]; then
            echo "::error::The jet-pilot-docs deploy didn't start"
            exit 1
          fi
          echo "Deploy: https://github.com/unxsist/jet-pilot-docs/actions/runs/$run"
          gh run watch "$run" -R unxsist/jet-pilot-docs --exit-status --interval 15 > /dev/null

      - name: jet-pilot.app serves the update
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for _ in $(seq 1 40); do
            served=$(curl -fsSL "https://www.jet-pilot.app/latest.json?t=$(date +%s)" | jq -r .version || true)
            if [[ "$served" == "$VERSION" ]]; then
              echo "jet-pilot.app/latest.json serves $VERSION"
              echo "### Installed apps are offered v$VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::jet-pilot.app/latest.json still serves ${served:-nothing}, not $VERSION"
          exit 1

  # macOS installs go through unxsist/homebrew-tap: homebrew/cask disabled
  # the cask because JET Pilot isn't notarized by Apple.
  homebrew:
    name: Homebrew tap
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bump the jet-pilot cask
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
        run: .github/scripts/bump-homebrew-cask.sh "${{ needs.prepare.outputs.tag }}"

  notify:
    name: Notify
    needs: [prepare, publish, website, homebrew]
    # Homebrew trouble shouldn't keep the news from reporters.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.website.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Tell released PRs and fixed issues
        uses: actions/github-script@v7
        with:
          script: |
            const release = require("./.github/scripts/release.cjs");
            await release.notify({ github, core, version: "${{ needs.prepare.outputs.version }}" });
