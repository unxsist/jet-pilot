name: Release

on:
  release:
    types: [created]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # Native x86_64 runner (macos-13 was retired); tauri-action uses process.arch for the updater signature filename
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm" # aarch64 Linux (#60)
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.settings.platform, 'ubuntu')
        run: |
          sudo apt update;
          sudo apt install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev;
          sudo apt install -y \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 \
            libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 \
            gir1.2-webkit2-4.1;

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Fetch release notes
        uses: actions/github-script@v7
        id: release_notes
        with:
          result-encoding: string
          script: |
            const packageVersion = require('./package.json').version;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `v${packageVersion}`
            });
            return release.body;

      - name: Create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "v__VERSION__"
          releaseBody: "${{steps.release_notes.outputs.result}}"
          releaseDraft: true
          prerelease: false
          tauriScript: ./node_modules/.bin/tauri
          args: ${{ matrix.settings.args }}

  publish_update_manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Invoke JET Pilot Docs deployment
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy.yml
          repo: unxsist/jet-pilot-docs
          ref: main
          token: "${{ secrets.SEMANTIC_RELEASE_PAT }}"
