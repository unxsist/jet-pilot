                - message: chart.spec.reconcileStrategy cannot be set when chart.kind is 'OCIRepository'
                  rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.reconcileStrategy) || self.spec.reconcileStrategy == ''ChartVersion'''
